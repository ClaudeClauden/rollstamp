version: 2
updates:
  # Rust dependencies – minor/patch updates grouped into one PR per week.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
        exclude-patterns: ["eframe", "egui*", "epaint*", "emath"]
        update-types: ["minor", "patch"]
    # New egui/eframe 0.x versions change the API and need code changes,
    # so these upgrades are done manually instead of by Dependabot.
    ignore:
      - dependency-name: "eframe"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "egui*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions used in the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
