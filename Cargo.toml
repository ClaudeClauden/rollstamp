[package]
name = "rollstamp"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Date, place and metadata for scanned film rolls – portable desktop tool (DE/EN)"
license = "MIT"
readme = "README.md"
# GitHub repository – also identifies the app to the OpenStreetMap place search.
repository = "https://github.com/ClaudeClauden/rollstamp"
keywords = ["exif", "photo", "film", "scan", "metadata"]
categories = ["multimedia::images"]
publish = false

[dependencies]
# GUI. Upgrades to newer egui versions may need code changes – CI shows whether a Dependabot PR still builds.
eframe = "0.37"
rfd = "0.15"
image = { version = "0.25.5", default-features = false, features = ["tiff", "jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sys-locale = "0.3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
